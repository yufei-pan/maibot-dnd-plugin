<!--
  地下城地图模板 · 羊皮纸风格
  占位符：{map_title} {map_body} {legend_html}
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  #map {
    width: 900px;
    min-height: 520px;
    display: flex;
    flex-direction: column;
    border-radius: 22px;
    overflow: visible;
    color: #4a3416;
    background:
      radial-gradient(circle at 18% 10%, rgba(255,250,235,0.7), rgba(0,0,0,0) 45%),
      radial-gradient(circle at 88% 90%, rgba(160,120,70,0.25), rgba(0,0,0,0) 52%),
      linear-gradient(135deg, #f3e3c0 0%, #e7cf9f 55%, #dcbe85 100%);
    border: 6px solid #8a5a2b;
    box-shadow: inset 0 0 60px rgba(120,80,30,0.35);
  }

  .header {
    padding: 16px 24px 10px;
    text-align: center;
    border-bottom: 2px solid rgba(138,90,43,0.5);
  }
  .map-title {
    font-size: 28px; font-weight: 800; letter-spacing: 2px;
    color: #7a4a1e; text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  }

  .content {
    flex: 1;
    padding: 18px 24px 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .map-body {
    flex: 1;
    min-height: 360px;
    font-size: 16px;
    line-height: 1.65;
    color: #4a3416;
    white-space: pre-wrap;
    word-break: break-word;
    background: rgba(255,250,238,0.55);
    border: 1px solid rgba(138,90,43,0.35);
    border-radius: 14px;
    padding: 16px 18px;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .legend-item {
    font-size: 13px;
    background: rgba(255,250,238,0.6);
    border: 1px solid rgba(138,90,43,0.3);
    border-radius: 8px;
    padding: 4px 10px;
    color: #6a3a10;
  }
</style>

<div id="map">
  <div class="header">
    <div class="map-title">🗺 {map_title}</div>
  </div>
  <div class="content">
    <div class="map-body">{map_body}</div>
    {legend_html}
  </div>
</div>
