<!--
  地下城角色卡模板 · 羊皮纸风格
  占位符：
    {card_title} {mugshot_html} {character_name} {player_id_block}
    {hp_label} {hp_value} {abilities_html} {skills_html}
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  #card {
    width: 920px;
    display: flex;
    flex-direction: column;
    border-radius: 22px;
    overflow: visible;
    color: #4a3416;
    background:
      radial-gradient(circle at 20% 12%, rgba(255,250,235,0.7), rgba(0,0,0,0) 45%),
      radial-gradient(circle at 85% 92%, rgba(160,120,70,0.25), rgba(0,0,0,0) 52%),
      linear-gradient(135deg, #f3e3c0 0%, #e7cf9f 55%, #dcbe85 100%);
    border: 6px solid #8a5a2b;
    box-shadow: inset 0 0 60px rgba(120,80,30,0.35);
  }

  .titlebar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 14px;
    padding: 14px 22px 10px;
  }
  .tb-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .tb-center {
    text-align: center; font-size: 25px; font-weight: 800; letter-spacing: 2px;
    color: #7a4a1e; text-shadow: 0 1px 0 rgba(255,255,255,0.5); white-space: nowrap;
  }
  .tb-right { text-align: right; }

  .mugshot {
    width: 88px; height: 88px; border-radius: 50%;
    object-fit: cover; border: 3px solid #8a5a2b;
    box-shadow: 0 2px 8px rgba(80,50,20,0.4); flex-shrink: 0;
  }
  .mugshot-placeholder {
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: 800; color: #fff;
    background: linear-gradient(135deg, #b07a3c, #8a5a2b);
  }
  .names { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .character-name {
    font-size: 28px; font-weight: 800; color: #5a3a14;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .player-id { font-size: 14px; color: #9a6a32; font-style: italic; }

  .hp-label { font-size: 13px; color: #8a5a2b; letter-spacing: 1px; }
  .hp-value { font-size: 40px; font-weight: 800; color: #6a3a10; line-height: 1.05; }

  .body {
    display: flex;
    border-top: 2px solid rgba(138,90,43,0.5);
    border-radius: 0 0 16px 16px;
    overflow: visible;
    align-items: stretch;
  }
  .panel {
    flex: 1;
    padding: 14px 20px 18px;
    min-width: 0;
  }
  .panel + .panel {
    border-left: 3px dashed rgba(138,90,43,0.55);
  }
  .panel-title {
    font-size: 16px; font-weight: 700; color: #7a4a1e;
    margin-bottom: 10px; letter-spacing: 1px;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }
  .stat-item {
    background: rgba(255,250,238,0.6);
    border: 1px solid rgba(138,90,43,0.35);
    border-radius: 10px;
    padding: 8px 10px;
    text-align: center;
  }
  .stat-key {
    font-size: 13px; font-weight: 700; color: #7a4a1e;
    letter-spacing: 1px; text-transform: uppercase;
  }
  .stat-val { font-size: 18px; font-weight: 800; color: #6a3a10; margin-top: 2px; }

  .skill-list { display: flex; flex-direction: column; gap: 6px; }
  .skill-item {
    display: flex; justify-content: space-between; align-items: baseline;
    background: rgba(255,250,238,0.55);
    border: 1px solid rgba(138,90,43,0.3);
    border-radius: 8px; padding: 6px 10px;
    font-size: 15px;
  }
  .skill-name { color: #5a3a14; font-weight: 600; }
  .skill-bonus { font-weight: 800; color: #6a3a10; }
  .empty-note {
    font-size: 14px; color: #9a6a32; font-style: italic;
    background: rgba(255,250,238,0.45);
    border: 1px dashed rgba(138,90,43,0.35);
    border-radius: 8px; padding: 10px 12px;
  }
</style>

<div id="card">
  <div class="titlebar">
    <div class="tb-left">
      {mugshot_html}
      <div class="names">
        <div class="character-name">{character_name}</div>
        {player_id_block}
      </div>
    </div>
    <div class="tb-center">⚜ {card_title} ⚜</div>
    <div class="tb-right">
      <div class="hp-label">{hp_label}</div>
      <div class="hp-value">{hp_value}</div>
    </div>
  </div>

  <div class="body">
    <div class="panel">
      <div class="panel-title">能力值</div>
      {abilities_html}
    </div>
    <div class="panel">
      <div class="panel-title">技能</div>
      {skills_html}
    </div>
  </div>
</div>
